site_name: Отчеты по лабораторным работам
site_description: Лабораторные работы по веб-программированию - Инструменты разработки
site_author: Маракулин Андрей
repo_url: https://github.com/
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/lightbulb-outline
        name: Темный режим
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/lightbulb
        name: Светлый режим
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex
  - pymdownx.emoji
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Главная: index.md
  - Лабораторная 1: lab1/report.md
  # - Лабораторная 2: lab2/report.md
  # - Лабораторная 3: lab3/report.md
